name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run build
      # Static QA (qa/check-dist.mjs). Route-missing blockers are expected until M4 ships every page;
      # remove continue-on-error once all routes in qa/routes.txt are built.
      - run: npm run qa:static
        continue-on-error: true
