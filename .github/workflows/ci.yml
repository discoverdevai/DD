name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high   # production dependencies only (07 §14.3)
      - run: npm run check
      - run: npm run lint            # css-logical-lint + i18n-gate (07 §15)
      - run: npm run test:unit
      - run: npm run build
      - run: npm run qa:static       # qa/check-dist.mjs: every route built, so blockers now fail the job
      - run: npm run test:gates      # cta-ids, inbound-links, jsonld-check, consent-gate, redirect rules (07 §15)
      # Redirects, 404 handling and security headers on the real Workers runtime (_redirects, _headers, not_found_handling).
      - name: Redirects and headers on wrangler dev
        run: |
          npx wrangler dev --port 8787 --ip 127.0.0.1 > wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:8787/ && break; sleep 1; done
          npm run test:redirects || (cat wrangler.log; exit 1)
      # axe + Lighthouse mobile on the built site (07 §15). Blockers (axe violations, budget misses) fail the job.
      - name: Browser audit (axe + Lighthouse)
        run: |
          npx playwright install --with-deps chromium
          node qa/serve.mjs dist 4321 > serve.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:4321/ && break; sleep 1; done
          node qa/browser-audit.mjs http://localhost:4321 --report browser-audit.md
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-audit
          path: browser-audit.md
          if-no-files-found: ignore
